# ---------------------------------------------------------------------------
# SonarQube / SonarCloud — configuracion del analisis (ponged, Rust)
#
# Pasos iniciales (una sola vez):
#   1. Crea el proyecto en SonarQube Cloud (https://sonarcloud.io) o en tu
#      instancia SonarQube Server.
#   2. Rellena aca abajo:
#        - sonar.projectKey  -> el key que genera SonarCloud/Server al crear el
#          proyecto (ej. "ponged").
#        - sonar.organization (SOLO SonarCloud) -> el key de tu organizacion.
#   3. Genera un token de analisis en la organizacion/proyecto y guardalo en
#      GitHub como secret `SONAR_TOKEN`.
#   4. Sube el workflow .github/workflows/sonar.yml.
#
# Si usas SonarQube Server propio, define tambien SONAR_HOST_URL en el repo
# (variables de GitHub) apuntando a tu instancia.
# ---------------------------------------------------------------------------

# ----- Proyecto -------------------------------------------------------------
# Clave generada por SonarQube Cloud al conectar el repo de GitHub:
#   <organizacion-github>_<repo>  ->  KEROJAM_ponged
sonar.projectKey=KEROJAM_ponged
# Clave de la organizacion en SonarQube Cloud (aparece en la URL
# sonarcloud.io/organizations/<clave>/projects). Si usas SonarQube Server,
# comenta esta linea.
sonar.organization=kerojam

sonar.projectName=ponged
sonar.projectVersion=0.1.1

# ----- Scope del analisis ---------------------------------------------------
# Solo se analiza el codigo fuente de Rust; se excluye el arbol de build,
# binarios y artefactos estaticos.
sonar.sources=src
sonar.exclusions=target/**,dist/**,assets/**,**/*.markdown

# Clippy: se importa el reporte generado por el pipeline (evita que el scanner
# recompile el proyecto). Generacion:
#   cargo clippy --message-format=json > target/clippy.json
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/clippy.json

sonar.sourceEncoding=UTF-8

# ----- Cobertura de tests (LCOV) -------------------------------------------
# Generado por `cargo llvm-cov --lcov --output-path target/lcov.info`
sonar.rust.lcov.reportPaths=target/lcov.info

# Tests inline `#[cfg(test)]` dentro de src/.
sonar.tests=src