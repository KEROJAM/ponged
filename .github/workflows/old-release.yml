name: Release Cliente y Servidor

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release (ej. v1.0.0)"
        required: true
        type: string
      descripcion:
        description: "Descripción de la release (entregas de este sprint)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  compilacion:
    name: Compilar (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: linux
            extension: ""
          - os: windows-latest
            nombre: windows
            build: windows-gnu
            target: x86_64-pc-windows-gnu
            extension: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      # Linux: binarios estaticos musl (sin dependencias de glibc ni libs del sistema).
      - name: Instalar Nix (Linux)
        if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Compilar binarios estaticos musl (Linux)
        if: runner.os == 'Linux'
        run: |
          nix build .#pong-client --no-link --print-out-paths
          nix build .#pong-gateway --no-link --print-out-paths
          CLIENT=$(nix build .#pong-client --no-link --print-out-paths)
          GATEWAY=$(nix build .#pong-gateway --no-link --print-out-paths)
          mkdir -p dist
          cp "$CLIENT/bin/ponged" dist/pong-cliente-linux-x86_64
          cp "$GATEWAY/bin/pong-gateway" dist/pong-servidor-linux-x86_64
          # Use patchelf to fix RPATH so the binary finds shared libs
          # at runtime even when copied out of the Nix store.
          sudo apt-get update -y
          sudo apt-get install -y patchelf
          CLIENT_LIBS="$CLIENT/lib"
          patchelf --set-rpath "$CLIENT_LIBS" dist/pong-cliente-linux-x86_64
          GATEWAY_LIBS="$GATEWAY/lib"
          patchelf --set-rpath "$GATEWAY_LIBS" dist/pong-servidor-linux-x86_64
          cp -r "$CLIENT/lib/"*.so* dist/ 2>/dev/null || true
          cp -r "$GATEWAY/lib/"*.so* dist/ 2>/dev/null || true

      - name: Instalar Rust stable (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar cliente y servidor en release (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --bin ponged --bin pong-gateway

      - name: Empaquetar binarios (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/release/ponged.exe dist/pong-cliente-windows-x86_64.exe
          cp target/release/pong-gateway.exe dist/pong-servidor-windows-x86_64.exe

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: binarios-${{ matrix.nombre }}
          path: dist/

  release:
    name: Publicar release
    needs: compilacion
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Copiar gateways.json para que los usuarios tengan la lista
      # de servidores ordenada por ping al descargar la release.
      - name: Copiar configuracion de servidores
        run: |
          mkdir -p dist/gateway-config
          cp assets/gateways.json dist/gateway-config/

      - name: Crear tag y release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ github.event.inputs.version }}"
          body: ${{ github.event.inputs.descripcion }}
          files: dist/**/*
