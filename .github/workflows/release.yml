name: Release Cliente y Servidor

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release (ej. v1.0.0)"
        required: true
        type: string
      descripcion:
        description: "Descripción de la release (entregas de este sprint)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  compilacion:
    name: Compilar (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: linux
            extension: ""
          - os: windows-latest
            nombre: windows
            build: windows-gnu
            target: x86_64-pc-windows-gnu
            extension: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      # Linux: gateway musl 100% estatico (nix); cliente glibc dinamico
      # compilado con cargo contra las libs del sistema (portable).
      - name: Instalar dependencias de build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config libssl-dev perl

      - name: Instalar Rust stable (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Nix (Linux)
        if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Compilar gateway estatico musl (Linux)
        if: runner.os == 'Linux'
        run: |
          GATEWAY=$(nix build .#pong-gateway --no-link --print-out-paths)
          mkdir -p dist
          install -m 0755 "$GATEWAY/bin/pong-gateway" dist/pong-servidor-linux-x86_64

      - name: Compilar cliente release (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cargo build --release --bin ponged
          install -m 0755 target/release/ponged dist/pong-cliente-linux-x86_64
          cp -r assets dist/assets

      - name: Instalar Rust stable (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar cliente y servidor en release (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --bin ponged --bin pong-gateway

      - name: Empaquetar binarios (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/release/ponged.exe dist/pong-cliente-windows-x86_64.exe
          cp target/release/pong-gateway.exe dist/pong-servidor-windows-x86_64.exe
          xcopy /E /I assets dist\assets

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: binarios-${{ matrix.nombre }}
          path: dist/

  release:
    name: Publicar release
    needs: compilacion
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Copiar gateways.json para que los usuarios tengan la lista
      # de servidores ordenada por ping al descargar la release.
      - name: Copiar configuracion de servidores
        run: |
          mkdir -p dist/gateway-config
          cp assets/gateways.json dist/gateway-config/

      - name: Crear tag y release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ github.event.inputs.version }}"
          body: ${{ github.event.inputs.descripcion }}
          files: dist/**/*
