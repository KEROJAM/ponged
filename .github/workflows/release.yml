name: Release Cliente y Servidor

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release (ej. v1.0.0)"
        required: true
        type: string
      descripcion:
        description: "Descripción de la release (entregas de este sprint)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  compilacion:
    name: Compilar (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: linux
            extension: ""
          - os: windows-latest
            nombre: windows
            build: windows-gnu
            target: x86_64-pc-windows-gnu
            extension: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      # Linux: gateway musl 100% estatico (nix); cliente glibc dinamico
      # compilado con cargo contra las libs del sistema (portable).
      - name: Instalar dependencias de build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config perl libssl-dev \
            libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev \
            libvulkan-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxcb1-dev

      - name: Instalar Rust stable (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Nix (Linux)
        if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Compilar gateway estatico musl (Linux)
        if: runner.os == 'Linux'
        run: |
          GATEWAY=$(nix build .#ponged-gateway --no-link --print-out-paths)
          mkdir -p dist
          install -m 0755 "$GATEWAY/bin/ponged-gateway" dist/pong-servidor-linux-x86_64

      - name: Compilar cliente release (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cargo build --release --bin ponged-cliente
          install -m 0755 target/release/ponged-cliente dist/ponged-cliente-linux-x86_64
          cp -r assets dist/assets

      # Windows: toolchain GNU target (x86_64-pc-windows-gnu). Un binario GNU
      # enlaza contra el UCRT de Windows 10+ y NO necesita VCRUNTIME140.dll
      # (a diferencia del MSVC). Sin esto, un cargo build --release normal
      # compila con el host MSVC y el .exe pide el runtime de Visual C++.
      - name: Instalar Rust stable (Windows)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # SQLCipher/OpenSSL empaquetados se compilan desde fuente en build time:
      # con el target GNU el crate cc busca un gcc MinGW-w64.
      - name: Instalar toolchain MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress

      # OpenSSL vendored (openssl-src) exige un perl "Unix-like" (paths con /)
      # y un make estilo MSYS: el perl nativo MSWin32 de Strawberry que trae el
      # runner falla ("This perl implementation doesn't produce Unix like
      # paths"). MSYS2 aporta ese perl/make; con `path-type: inherit` quedan
      # primeros en el PATH del shell y el gcc/ar de MinGW-w64 (choco) se
      # hereda para el resto.
      - name: Instalar MSYS2 (perl/make Unix-like para OpenSSL vendored)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            make
            perl

      - name: Compilar cliente y servidor en release (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cargo build --release --target ${{ matrix.target }} --bin ponged-cliente --bin ponged-gateway

      - name: Empaquetar binarios (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ponged-cliente.exe dist/ponged-cliente-windows-x86_64.exe
          cp target/${{ matrix.target }}/release/ponged-gateway.exe dist/pong-servidor-windows-x86_64.exe
          xcopy /E /I assets dist\assets

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: binarios-${{ matrix.nombre }}
          path: dist/

  release:
    name: Publicar release
    needs: compilacion
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Unificar assets compartidos: los artefactos por plataforma incluyen
      # DIST/assets (gateways.json, fonts/DejaVuSans.ttf). Subir assets con el
      # mismo nombre desde ambos artefactos da error en action-gh-release
      # (update release asset metadata -> HttpError: Not Found), asi que se
      # sube una sola copia desde el repo.
      - name: Unificar assets de la release
        run: |
          set -euo pipefail
          rm -rf dist/assets
          find dist/binarios-linux dist/binarios-windows \
            -type d -name assets -exec rm -rf {} +
          rm -rf dist/gateway-config

      - name: Crear tag y release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ github.event.inputs.version }}"
          body: ${{ github.event.inputs.descripcion }}
          files: dist/**/*
