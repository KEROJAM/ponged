[package]
name = "ponged"
version = "0.1.1"
edition = "2024"

[lib]
name = "ponged"
path = "src/lib.rs"

[[bin]]
name = "ponged"
path = "src/main.rs"

[[bin]]
name = "pong-gateway"
path = "src/bin/gateway.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui", "x11"] }
libp2p = { version = "0.56.0", features = ["tcp", "tokio", "noise", "yamux", "mdns", "identify", "ping", "macros", "request-response", "cbor", "rendezvous", "kad", "relay", "dcutr", "dns"] }
dirs = "5"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Moderator accounts for the HTTP moderation page (salted, iterated SHA-256).
sha2 = "0.10"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# CBOR wire encoding for the gateway signed-rating ledger.
cbor4ii = "0.3"
# SQLCipher + OpenSSL are compiled from source and statically linked into
# the binary: no system sqlcipher/openssl install needed on any machine.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
